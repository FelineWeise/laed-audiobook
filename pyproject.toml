[project]
name = "laed-audiobook"
version = "0.1.0"
description = "Slim CLI: documents and clipboard to a stitched audiobook via llm-gateway Kokoro TTS"
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "python-dotenv>=1.0.0",
    "typer>=0.12.0",
    "pymupdf>=1.24.0",
    "beautifulsoup4>=4.12.0",
    "markdown-it-py>=3.0.0",
    "jinja2>=3.1.0",
]

[project.scripts]
audiobook = "audiobook.cli:app"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
audiobook = ["py.typed", "prompts/*.jinja"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.8.0",
]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
